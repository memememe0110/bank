<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e8e8e8">
  <title>Wallet Mock</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      background: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #e8e8e8;
      position: relative;
    }

    .screen {
      display: none;
      position: relative;
      width: 100%;
    }

    .screen.active {
      display: block;
    }

    .screen-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      display: block;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    /* Bottom tab tap areas: percentages based on screenshot */
    .tab-wallet  { left: 0%;  top: 87%; width: 20%; height: 13%; }
    .tab-banking { left: 20%; top: 87%; width: 20%; height: 13%; }
    .tab-record  { left: 40%; top: 87%; width: 20%; height: 13%; }
    .tab-links   { left: 60%; top: 87%; width: 20%; height: 13%; }
    .tab-circle  { left: 80%; top: 87%; width: 20%; height: 13%; }

    .page {
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 24px) 24px calc(120px + env(safe-area-inset-bottom));
      background: #ececec;
      color: #111;
      position: relative;
    }

    .title {
      font-size: 50px;
      line-height: 1;
      font-weight: 900;
      margin: 0;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 800;
      margin: 8px 0 0;
    }

    .placeholder-box {
      margin-top: 36px;
      border: 3px solid #111;
      border-radius: 24px;
      padding: 24px;
      background: white;
    }

    .placeholder-box p {
      margin: 0;
      font-size: 17px;
      line-height: 1.7;
      font-weight: 600;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(100%, 430px);
      height: calc(96px + env(safe-area-inset-bottom));
      background: #000;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 20;
    }

    .nav-button {
      flex: 1;
      border: 0;
      background: transparent;
      color: #8e8e93;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 25px;
      position: relative;
    }

    .nav-button span {
      font-size: 11px;
      font-weight: 700;
      color: inherit;
    }

    .nav-button.active {
      color: #fff;
    }

    .nav-button.active::after {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f0f900;
      position: absolute;
      bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    /* Keep image page clean when using the screenshot tabs */
    .image-screen .bottom-nav {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="wallet" class="screen active image-screen">
      <img class="screen-image" src="wallet.png" alt="Wallet mock screen">
      <button class="hotspot tab-banking" aria-label="バンキングへ" onclick="showScreen('banking')"></button>
    </section>

    <section id="banking" class="screen image-screen">
      <img class="screen-image" src="banking.png" alt="Banking mock screen">
      <button class="hotspot tab-wallet" aria-label="ウォレットへ" onclick="showScreen('wallet')"></button>
    </section>

    <section id="record" class="screen">
      <div class="page">
        <h1 class="title">Record</h1>
        <p class="subtitle">レコード</p>
        <div class="placeholder-box">
          <p>このタブはまだモック未作成です。<br>必要なら次にこの画面も同じテイストで追加できます。</p>
        </div>
      </div>
    </section>

    <section id="links" class="screen">
      <div class="page">
        <h1 class="title">Links</h1>
        <p class="subtitle">リンクス</p>
        <div class="placeholder-box">
          <p>このタブはまだモック未作成です。<br>必要なら次にこの画面も同じテイストで追加できます。</p>
        </div>
      </div>
    </section>

    <section id="circle" class="screen">
      <div class="page">
        <h1 class="title">Circle</h1>
        <p class="subtitle">サークル</p>
        <div class="placeholder-box">
          <p>このタブはまだモック未作成です。<br>必要なら次にこの画面も同じテイストで追加できます。</p>
        </div>
      </div>
    </section>

    <nav id="customNav" class="bottom-nav hidden" aria-label="Bottom Navigation">
      <button class="nav-button" data-screen="wallet" onclick="showScreen('wallet')">▣<span>ウォレット</span></button>
      <button class="nav-button" data-screen="banking" onclick="showScreen('banking')">🏛<span>バンキング</span></button>
      <button class="nav-button" data-screen="record" onclick="showScreen('record')">◎<span>レコード</span></button>
      <button class="nav-button" data-screen="links" onclick="showScreen('links')">♧<span>リンクス</span></button>
      <button class="nav-button" data-screen="circle" onclick="showScreen('circle')">◉<span>サークル</span></button>
    </nav>
  </div>

  <script>
    const screens = document.querySelectorAll('.screen');
    const customNav = document.getElementById('customNav');
    const navButtons = document.querySelectorAll('.nav-button');

    function showScreen(name) {
      screens.forEach(screen => {
        screen.classList.toggle('active', screen.id === name);
      });

      const isImageScreen = name === 'wallet' || name === 'banking';
      customNav.classList.toggle('hidden', isImageScreen);

      navButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.screen === name);
      });

      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
