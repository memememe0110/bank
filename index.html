<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Wallet Mock</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=29">
</head>
<body>
<div class="app">

  <main>
    <section id="wallet" class="screen">
      <div class="wallet-page">
        <header class="wallet-header">
          <div>
            <h1>Wallet</h1>
            <p>よく使う銀行機能</p>
          </div>
          <div class="wallet-header-icons" aria-hidden="true">
            <img class="wallet-header-icon" src="assets/header-notice.jpeg" alt="">
            <img class="wallet-header-icon" src="assets/header-person.jpeg" alt="">
          </div>
        </header>

        <div class="wallet-hero-wrap">
          <img id="walletHero" src="assets/wallet-hero-1.jpeg" alt="" class="wallet-hero">
        </div>

        <section class="wallet-account">
          <div class="wallet-account-line">普通預金 <span id="walletBranch">丸善ジュンク堂支店</span></div>
          <div class="wallet-account-actions">
            <strong id="walletBalance" class="is-hidden">¥ ********</strong>
            <button class="deposit-btn">♧ 入金方法を見る</button>
          </div>
          <button class="hide-balance" id="balanceToggle"><span class="eye-mark">◉</span><span id="balanceToggleText">残高を表示</span></button>
        </section>

        <button class="wallet-link" id="walletArticle">
          <span>熊本につなごう Cheer Box/Cheerコード</span><b>›</b>
        </button>

        <button class="wallet-action" id="walletAction">
          <span>送金・ATM・デビットカード</span><b>⌃</b>
        </button>
      </div>
    </section>

    <section id="banking" class="screen active">
      <div class="banking-page">
        <header class="header">
          <h1>Banking</h1>
          <p>すべての銀行機能</p>
        </header>

        <section class="ordinary">
          <h2>普通預金</h2>

          <button class="account-card">
            <div class="account-copy">
              <div class="branch-row">
                <span>丸善ジュンク堂支店</span>
              </div>
              <span class="account-card-arrow">›</span>
              <div class="balance">¥0</div>
            </div>
            <img src="assets/bank-book.jpeg" alt="" class="bank-img">
          </button>

          
        </section>

        <section class="savings-area">
          <div class="tabs">
            <button class="tab active">貯蓄預金</button>
            <button class="tab">ローン</button>
          </div>

          <div class="card-row">
            <button class="saving-card">
              <div class="saving-title">Saving</div>
              <div class="saving-balance">¥24,000</div>
              <img src="assets/pig.jpeg" alt="" class="pig-img">
            </button>

            <button class="create-card">
              <img src="assets/create-box.jpeg" alt="ボックス作成" class="create-img">
            </button>
          </div>
        </section>

        <div class="divider"></div>

        <section class="menu-list">
          <button class="menu-row">
            <img src="assets/schedule.jpeg" alt="" class="menu-icon">
            <span>お金の移動 スケジュール一覧</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-row">
            <img src="assets/sort.jpeg" alt="" class="menu-icon">
            <span>ボックスの並び替え</span>
            <span class="menu-arrow">›</span>
          </button>
        </section>
      </div>
    </section>

    <section id="record" class="screen">
      <div class="record-page">
        <header class="record-header">
          <div>
            <h1>Record</h1>
            <p>資産をまとめて管理</p>
          </div>
          <div class="record-header-actions" aria-hidden="true">
            <span>?</span><span>↻</span><span>•••</span>
          </div>
        </header>

        <div class="record-tabs">
          <button class="record-tab active">トップ</button>
          <button class="record-tab">資産推移</button>
          <button class="record-tab">明細</button>
          <button class="record-tab">ハッシュタグ</button>
        </div>

        <div class="record-cards">
          <button class="record-card">
            <div class="record-card-copy">
              <div class="record-card-title">預金 <span>(2)</span></div>
              <div class="record-card-amount">¥24,000</div>
            </div>
            <img src="assets/record-cash.jpeg" class="record-card-img cash-img" alt="">
          </button>

          <button class="record-card">
            <div class="record-card-copy">
              <div class="record-card-title">クレジットカード <span>(0)</span></div>
              <div class="record-card-amount">¥0</div>
            </div>
            <img src="assets/record-credit.jpeg" class="record-card-img credit-img" alt="">
          </button>

          <button class="record-card">
            <div class="record-card-copy">
              <div class="record-card-title">デビット・電子マネー <span>(0)</span></div>
              <div class="record-card-amount">¥0</div>
            </div>
            <img src="assets/record-debit.jpeg" class="record-card-img debit-img" alt="">
          </button>

          <button class="record-card">
            <div class="record-card-copy">
              <div class="record-card-title">その他資産 <span>(0)</span></div>
              <div class="record-card-amount">¥0</div>
            </div>
            <img src="assets/record-other.jpeg" class="record-card-img other-img" alt="">
          </button>

          <button class="record-add">連携先を追加</button>
        </div>
      </div>
    </section>
    <section id="links" class="screen"><div class="simple"><h1>Links</h1><p>リンクス</p></div></section>
    <section id="circle" class="screen"><div class="simple"><h1>Circle</h1><p>サークル</p></div></section>
  </main>

  <nav class="bottom-nav">
    <button data-screen="wallet" class="nav-item active">
      <span class="nav-art"><img src="assets/nav-wallet.jpg" alt="ウォレット"></span>
    </button>
    <button data-screen="banking" class="nav-item">
      <span class="nav-art"><img src="assets/nav-banking.jpg" alt="バンキング"></span>
    </button>
    <button data-screen="record" class="nav-item">
      <span class="nav-art"><img src="assets/nav-record.jpg" alt="レコード"></span>
    </button>
    <button data-screen="links" class="nav-item">
      <span class="nav-art"><img src="assets/nav-links.jpg" alt="リンクス"></span>
    </button>
    <button data-screen="circle" class="nav-item">
      <span class="nav-art"><img src="assets/nav-circle.jpg" alt="サークル"></span>
    </button>
  </nav>
</div>
<script src="app.js?v=29"></script>
</body>
</html>
