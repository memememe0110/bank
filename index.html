<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Wallet Mock</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<div class="app">

  <main>
    <section id="wallet" class="screen">
      <div class="simple">
        <h1>Wallet</h1>
        <p>よく使う銀行機能</p>
        <div class="simple-card">
          <div>普通預金　ハーバーブリッジ支店</div>
          <strong>¥0</strong>
        </div>
      </div>
    </section>

    <section id="banking" class="screen active">
      <div class="banking-page">
        <header class="header">
          <h1>Banking</h1>
          <p>すべての銀行機能</p>
        </header>

        <section class="ordinary">
          <h2>普通預金</h2>

          <button class="account-card">
            <div class="account-copy">
              <div class="branch-row">
                <span>ハーバーブリッジ支店</span>
                <span class="arrow">›</span>
              </div>
              <div class="balance">¥0</div>
            </div>
            <img src="assets/bank.jpeg" alt="" class="bank-img">
          </button>

          <button class="show-all">口座をすべて表示 <span>⌄</span></button>
        </section>

        <section class="savings-area">
          <div class="tabs">
            <button class="tab active">貯蓄預金</button>
            <button class="tab">ローン</button>
          </div>

          <div class="card-row">
            <button class="saving-card">
              <div class="saving-title">Saving</div>
              <div class="saving-balance">¥24,000</div>
              <img src="assets/pig.jpeg" alt="" class="pig-img">
            </button>

            <button class="create-card">
              <img src="assets/create-box.jpeg" alt="ボックス作成" class="create-img">
            </button>
          </div>
        </section>

        <div class="divider"></div>

        <section class="menu-list">
          <button class="menu-row">
            <img src="assets/schedule.jpeg" alt="" class="menu-icon">
            <span>お金の移動 スケジュール一覧</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-row">
            <img src="assets/sort.jpeg" alt="" class="menu-icon">
            <span>ボックスの並び替え</span>
            <span class="menu-arrow">›</span>
          </button>
        </section>
      </div>
    </section>

    <section id="record" class="screen"><div class="simple"><h1>Record</h1><p>レコード</p></div></section>
    <section id="links" class="screen"><div class="simple"><h1>Links</h1><p>リンクス</p></div></section>
    <section id="circle" class="screen"><div class="simple"><h1>Circle</h1><p>サークル</p></div></section>
  </main>

  <nav class="bottom-nav">
    <button data-screen="wallet" class="nav-item">
      <span class="nav-symbol">▣</span><span>ウォレット</span><i></i>
    </button>
    <button data-screen="banking" class="nav-item active">
      <span class="nav-symbol">⌂</span><span>バンキング</span><i></i>
    </button>
    <button data-screen="record" class="nav-item">
      <span class="nav-symbol">◎</span><span>レコード</span><i></i>
    </button>
    <button data-screen="links" class="nav-item">
      <span class="nav-symbol">♧</span><span>リンクス</span><i></i>
    </button>
    <button data-screen="circle" class="nav-item">
      <span class="nav-symbol">◉</span><span>サークル</span><i></i>
    </button>
  </nav>
</div>
<script src="app.js?v=14"></script>
</body>
</html>
